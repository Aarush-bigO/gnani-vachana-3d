name: Bug Report
description: File a bug report or regression in Gnani Vachana 3D
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report an issue!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: input
    id: latency
    attributes:
      label: Turnaround Latency Observed (ms)
      description: If this is a latency issue, what was the measured roundtrip latency?
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Browser (Chrome/Brave/Firefox)
